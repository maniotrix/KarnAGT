version: '3.8'

networks:
  codesandbox-prod-network:
    driver: bridge
    name: codesandbox-prod-network

services:
  codesandbox:
    container_name: codesandbox-production
    build: 
      context: .
      dockerfile: Dockerfile.prod
      args:
        CS_USER: code_sandbox
    ports:
      - "8080:8080"  # Fixed port since no env_file to interpolate
    networks:
      - codesandbox-prod-network
    # No volume mounts for production - code is baked into image
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
