version: '3.8'

services:
  codesandbox:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"  # Use PORT from .env file
    env_file:
      - .env  # Load all environment variables from .env file
    volumes:
      - ./:/app  # Mount source code for development
      - workspace_data:${WORKSPACE_BASE_PATH:-/tmp/workspaces}  # Use WORKSPACE_BASE_PATH from .env
    restart: unless-stopped

volumes:
  workspace_data:
    driver: local 