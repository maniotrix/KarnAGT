version: '3.8'

# Local development compose file for direct CodeSandbox access
# Use this when running backend locally (not in Docker) but want CodeSandbox container
# 
# Usage:
#   docker-compose -f docker-compose.local.yml up -d
#
# Local backend can then access: http://localhost:8080/api/v1

services:
  codesandbox-local:
    container_name: codesandbox-local
    build: 
      context: .
      dockerfile: Dockerfile.dev
      args:
        CS_USER: code_sandbox
    
    # Direct port mapping for local backend access
    ports:
      - "8080:8080"  # Direct access on localhost:8080
    
    # Local environment file
    volumes:
      # Hot reload for development
      - ./app:/home/code_sandbox/app
      - ./.env.docker.dev:/home/code_sandbox/.env
    
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=DEBUG
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Restart policy for local development
    restart: unless-stopped
    
    # Labels for identification
    labels:
      - "com.app.environment=local"
      - "com.app.service=code_execution"
      - "com.app.component=codesandbox"
      - "com.app.mode=standalone"
