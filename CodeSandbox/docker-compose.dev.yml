version: '3.8'

services:
  codesandbox-dev:
    container_name: codesandbox-development
    build: 
      context: .
      dockerfile: Dockerfile.dev
      args:
        CS_USER: code_sandbox
    ports:
      - "${PORT:-8080}:${PORT:-8080}"  # Use PORT from .env file
    env_file:
      - .env  # Load all environment variables from .env file
    volumes:
      - ./:/home/${CS_USER:-code_sandbox}  # Mount source code for development (hot reload)
    # No restart policy in dev mode for easier debugging
