version: '3.8'

services:
  app-backend-prod:
    container_name: app-backend-production
    build: 
      context: .
      dockerfile: Dockerfile.prod
      args:
        BACKEND_USER: app_backend_prod
    ports:
      - "8000:8000"  # Fixed port for frontend compatibility
    networks:
      - app-backend-prod-network
      - app_db_network_prod         # Connect to database network
      - codesandbox-prod-network    # Connect to CodeSandbox network
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # Temporary: Mount logs for early production debugging
      # TODO: Remove when centralized logging is implemented (CloudWatch, Datadog, etc.)
      - ./logs:/app/logs:rw
    # Production resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
networks:
  app-backend-prod-network:
    driver: bridge
    name: app-backend-prod-network
  app_db_network_prod:
    external: true
    name: app_db_network_prod
  codesandbox-prod-network:
    external: true
    name: codesandbox-prod-network
