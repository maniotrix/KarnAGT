version: '3.8'

services:
  app-backend-staging:
    container_name: app-backend-staging
    build: 
      context: .
      dockerfile: Dockerfile.prod  # Use prod dockerfile for staging
      args:
        BACKEND_USER: app_backend_staging
    ports:
      - "8000:8000"  # Fixed port for frontend compatibility
    networks:
      - app-backend-staging-network
      - app_db_network_staging      # Connect to database network
      - codesandbox-prod-network    # Connect to production CodeSandbox network
    environment:
      - ENVIRONMENT=staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # Temporary: Mount logs for early staging debugging
      # TODO: Remove when centralized logging is implemented (CloudWatch, Datadog, etc.)
      - ./logs:/app/logs:rw
    # Staging resource limits (between dev and prod)
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  app-backend-staging-network:
    driver: bridge
    name: app-backend-staging-network
  app_db_network_staging:
    external: true
    name: app_db_network_staging
  codesandbox-prod-network:
    external: true
    name: codesandbox-prod-network
