version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatgpt_user
      POSTGRES_PASSWORD: chatgpt_password
      POSTGRES_DB: chatgpt_clone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  neo4j:
    image: neo4j:5.19
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (optional)
      - "7687:7687"   # Bolt protocol for drivers
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  neo4jdata:
