version: '3.8'

# Unified staging network - created by database services
networks:
  staging-network:
    name: staging-network
    external: true

services:
  # Frontend Application - Staging
  app-frontend-staging:
    container_name: app-frontend-staging
    build: 
      context: .
      dockerfile: Dockerfile.staging
      args:
        VITE_API_URL: https://api-staging.yourdomain.com
        NODE_ENV: production
        FRONTEND_USER: app_frontend_staging
    networks:
      - staging-network  # Unified network with all services
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - VITE_API_URL=https://api-staging.yourdomain.com
    restart: unless-stopped
    labels:
      - "traefik.enable=true"  # Explicit exposure to Traefik
      # STAGING DOMAIN - Frontend gets main staging domain
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.yourdomain.com`)"
      - "traefik.http.routers.frontend-staging.entrypoints=websecure"  # HTTPS only

      - "traefik.http.services.frontend-staging.loadbalancer.server.port=3000"
      - "traefik.docker.network=staging-network"
      # STAGING: Let's Encrypt SSL
      - "traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt"
      # Priority for proper routing
      - "traefik.http.routers.frontend-staging.priority=1"
      # Metadata labels
      - "com.app.environment=staging"
      - "com.app.service=frontend"
      - "com.app.component=react_app"
    # No volume mounts for staging - static files baked into image
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Note: Dependencies are managed externally via startup order
    # Frontend starts after: database → codesandbox → backend (with traefik) → frontend
